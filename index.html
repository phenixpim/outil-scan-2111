<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scan Carte Grise</title>
    <style>
        body { background-color: #121212; color: white; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        button { background-color: #007AFF; color: white; border: none; padding: 20px 40px; font-size: 20px; border-radius: 12px; cursor: pointer; box-shadow: 0 4px 14px rgba(0, 122, 255, 0.4); font-weight: bold;}
        #status { margin-top: 20px; font-size: 16px; color: #888; }
    </style>
</head>
<body>
    <h2>Outil Garage</h2>
    
    <input type="file" accept="image/*" capture="environment" id="cameraInput" style="display: none;">
    <button onclick="document.getElementById('cameraInput').click()">📷 Scanner Carte Grise</button>
    
    <p id="status"></p>

    <script>
        const webhookUrl = "https://hook.eu1.make.com/ln6ety4dbmbsyo080o1mhpaqp9yh4z39"; 

        document.getElementById('cameraInput').addEventListener('change', function(event) {
            const file = event.target.files[0];
            if (!file) return;

            document.getElementById('status').innerText = "Envoi en cours vers Make...";

            const formData = new FormData();
            formData.append("image", file);

            fetch(webhookUrl, {
                method: "POST",
                body: formData
            })
            .then(response => {
                document.getElementById('status').innerText = "✅ Bien reçu par Make !";
            })
            .catch(error => {
                document.getElementById('status').innerText = "❌ Erreur de connexion.";
            });
        });
    </script>
</body>
</html>
